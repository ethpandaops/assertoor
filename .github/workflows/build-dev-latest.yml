
name: Build latest image

on:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  check_source:
    name: "Run code checks"
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build Assertoor"
    needs: [check_source]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_shared-build.yaml
    with:
      release: "snapshot"
      docker: true
      docker_repository: "ghcr.io/ethpandaops/assertoor"
      docker_tag_prefix: "master"
      additional_tags: "['master','master-latest','latest']"
    secrets:
      IMAGE_MIRROR_URL: ${{ secrets.IMAGE_MIRROR_URL }}
